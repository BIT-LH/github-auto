[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-auto"
version = "0.1.0"
description = "Multi-account GitHub automation CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "keyring>=25.0"
]

[project.scripts]
github-auto = "github_auto.cli:app"

[tool.setuptools.packages.find]
include = ["github_auto*"]
